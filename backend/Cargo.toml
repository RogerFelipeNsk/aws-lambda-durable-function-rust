[package]
name = "arena-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

[[bin]]
name = "api"
path = "src/bin/api.rs"

[[bin]]
name = "durable"
path = "src/bin/durable.rs"

[dependencies]
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-durable-execution-sdk = { version = "1.0.0", features = ["test-util"] }
aws-sdk-dynamodb = "1"
aws-sdk-lambda = "1"
aws-smithy-types = "1"
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
http = "1"
lambda_http = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
